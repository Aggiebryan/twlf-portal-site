<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TWLF Work Portal</title>
  <meta name="description" content="The Woodlands Law Firm work portal">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span class="brandmark">TW</span><span><b>TWLF</b> Portal</span></a>
    <label class="search"><span>⌕</span><input id="search" placeholder="Search portal…" autocomplete="off"><kbd>/</kbd></label>
    <div class="actions">
      <div class="size-control" aria-label="Card size">
        <button data-size="small" title="Small cards">S</button><button data-size="standard" title="Standard cards">M</button><button data-size="large" title="Large cards">L</button>
      </div>
      <button class="icon-button" id="theme" aria-label="Switch color theme"><span id="themeIcon">☾</span></button>
      <button class="add-button" data-add><span>＋</span> Add link</button>
    </div>
  </header>

  <nav class="category-nav" id="categoryNav" aria-label="Portal categories"></nav>

  <main class="workspace">
    <div class="workspace-head"><div><h1 id="pageTitle">All resources</h1><p id="pageCount"></p></div><button class="text-button" id="reset" hidden>Restore default links</button></div>
    <div id="notice"></div>
    <div id="content"></div>
    <div class="empty" id="empty" hidden><span>⌕</span><h2>No links found</h2><p>Try another search or add a new destination.</p><button class="add-button" data-add>Add link</button></div>
  </main>

  <div class="modal-backdrop" id="backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="close" aria-label="Close">×</button>
      <h2 id="modalTitle">Add a portal link</h2><p id="modalIntro">Add a destination to this browser’s TWLF portal.</p>
      <form id="form">
        <label>NAME<input name="name" placeholder="e.g. Benefits Portal" required maxlength="60"></label>
        <label>WEB ADDRESS<input name="url" placeholder="https://portal.example.com" required inputmode="url"></label>
        <label>CUSTOM LOGO ADDRESS <span class="optional">OPTIONAL</span><input name="logo" placeholder="https://example.com/logo.png" inputmode="url"></label>
        <label>CATEGORY<select name="category" id="categorySelect"></select></label>
        <div class="form-actions"><button type="button" id="cancel">Cancel</button><button class="save" id="saveLink">Add link</button></div>
      </form>
    </section>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
