<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWLF Portal — redesign prototype</title>
<style>
@font-face{font-family:Manrope;src:url('assets/manrope.woff2') format('woff2');font-weight:400 800;font-display:swap}
*{box-sizing:border-box}

:root{
  --ground:#111111;
  --glass:rgba(255,255,255,.045);
  --glass-strong:rgba(255,255,255,.07);
  --edge:rgba(255,255,255,.09);
  --edge-soft:rgba(255,255,255,.05);
  --ink:#ffffff;
  --muted:rgba(255,255,255,.52);
  --faint:rgba(255,255,255,.34);
  --teal:#14b8a6; --green:#4ade80; --pink:#ec4899; --amber:#f59e0b;
  --violet:#8b7cf6; --brand:#d9623f;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --blur:blur(22px) saturate(1.35);
  --backdrop-opacity:.42;
  --backdrop-blend:normal;
}
:root[data-theme=light]{
  --ground:#eceae4;
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.86);
  --edge:rgba(20,25,32,.10);
  --edge-soft:rgba(20,25,32,.06);
  --ink:#141b22;
  --muted:rgba(20,27,34,.58);
  --faint:rgba(20,27,34,.40);
  --backdrop-opacity:.10;
  --backdrop-blend:luminosity;
}

html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:Manrope,'DM Sans',system-ui,sans-serif;
  font-size:14px;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;
}
/* The Unsplash plate sits behind everything; the glass panels blur it. */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url('assets/backdrop.jpg') center/cover no-repeat;
  opacity:var(--backdrop-opacity);mix-blend-mode:var(--backdrop-blend);
}
body::after{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 50% at 18% 8%, rgba(20,184,166,.12), transparent 70%),
    radial-gradient(45% 40% at 88% 85%, rgba(236,72,153,.10), transparent 70%);
}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px;padding:18px;min-height:100vh}

/* ---------- left rail ---------- */
.rail{
  position:sticky;top:18px;height:calc(100vh - 36px);
  background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-lg);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;
}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#b2472c);
  display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;margin-bottom:12px;letter-spacing:-.04em}
.rail button{
  width:44px;height:44px;border:0;border-radius:13px;background:transparent;color:var(--faint);
  display:grid;place-items:center;cursor:pointer;transition:.16s;position:relative;
}
.rail button:hover{background:var(--glass-strong);color:var(--ink)}
.rail button[aria-current=page]{background:var(--glass-strong);color:var(--ink)}
.rail button[aria-current=page]::before{
  content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--brand);
}
.rail svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail .spacer{margin-top:auto}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.035em}
.top h1 small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:-.01em;margin-top:3px}
.segmented{
  display:flex;gap:3px;padding:4px;margin-left:8px;
  background:var(--glass);border:1px solid var(--edge);border-radius:999px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);overflow-x:auto;max-width:100%;
}
.segmented button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;
  padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.16s;
}
.segmented button:hover{color:var(--ink)}
.segmented button.on{background:var(--ink);color:var(--ground)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:9px}
.search{
  display:flex;align-items:center;gap:9px;height:42px;padding:0 15px;min-width:230px;
  background:var(--glass);border:1px solid var(--edge);border-radius:999px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;width:100%}
.search input::placeholder{color:var(--faint)}
.chip{
  height:42px;padding:0 16px;display:flex;align-items:center;gap:8px;cursor:pointer;
  background:var(--glass);border:1px solid var(--edge);border-radius:999px;color:var(--ink);
  font:inherit;font-size:12px;font-weight:700;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.chip.solid{background:var(--brand);border-color:var(--brand);color:#fff}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--violet));
  display:grid;place-items:center;font-size:10px;font-weight:800;color:#06121a}

/* ---------- layout ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media(max-width:1180px){.board{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.shell{grid-template-columns:1fr;padding:12px}.rail{position:static;height:auto;flex-direction:row;justify-content:flex-start;padding:10px 12px;overflow-x:auto}.rail .spacer{margin-top:0;margin-left:auto}.mark{margin-bottom:0;margin-right:6px}}

.panel{
  background:var(--glass);border:1px solid var(--edge);border-radius:var(--r-lg);padding:18px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.panel>header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel>header h2{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.panel>header .count{margin-left:auto;font-size:11px;color:var(--faint);font-weight:600}
.dot{width:7px;height:20px;border-radius:4px;background:var(--accent,var(--brand))}

/* ---------- hero feature cards ---------- */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:14px;margin-bottom:18px}
.feature{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px;min-height:232px;
  border:1px solid var(--edge);background:var(--glass);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;color:var(--ink);
  transition:transform .18s, border-color .18s;
}
.feature:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.feature::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:radial-gradient(120% 90% at 85% 10%, color-mix(in srgb,var(--accent) 42%,transparent), transparent 62%);
}
.feature>*{position:relative;z-index:1}
.feature .badge{
  align-self:flex-start;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 11px;border-radius:999px;color:#08131a;background:var(--accent);
}
.feature h3{margin:13px 0 2px;font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.18}
.feature p{margin:0;font-size:11px;color:var(--muted)}
/* Each hero card is a group of links, not a single destination. */
.feature-links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0 11px}
.mini{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;min-width:0;
  background:rgba(255,255,255,.08);border:1px solid var(--edge-soft);
  text-decoration:none;color:var(--ink);transition:.15s;
}
:root[data-theme=light] .mini{background:rgba(255,255,255,.75)}
.mini:hover{background:rgba(255,255,255,.17);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
:root[data-theme=light] .mini:hover{background:#fff}
.mini img{width:19px;height:19px;object-fit:contain;flex:0 0 auto;border-radius:4px;background:#fff}
.mini span{font-size:11px;font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini b{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--accent);flex:0 0 auto}
.feature .empty{font-size:11px;color:var(--faint);margin:13px 0 11px;line-height:1.5}

/* ---------- link tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{
  display:flex;align-items:center;gap:11px;padding:11px;border-radius:var(--r-md);
  background:var(--glass-strong);border:1px solid var(--edge-soft);text-decoration:none;color:var(--ink);
  transition:.16s;min-width:0;
}
.tile:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent);transform:translateY(-2px)}
.tile .logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.95);
  display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.tile .logo img{width:24px;height:24px;object-fit:contain}
.tile .txt{min-width:0}
.tile strong{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;font-size:10px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stack{display:flex;flex-direction:column;gap:18px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal span{font-size:9.5px;color:var(--faint);font-weight:700;padding:5px 0;text-transform:uppercase}
.cal b{font-size:11.5px;font-weight:600;padding:7px 0;border-radius:9px;color:var(--muted)}
.cal b.now{background:var(--brand);color:#fff;font-weight:800}
.cal b.has{color:var(--ink);background:var(--glass-strong)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--glass-strong);border:1px solid var(--edge-soft);border-radius:var(--r-md);padding:13px}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.04em;color:var(--accent,var(--ink))}
.stat small{font-size:10.5px;color:var(--muted);font-weight:600}

.note{position:fixed;left:18px;bottom:18px;z-index:5;background:var(--glass);border:1px solid var(--edge);
  border-radius:999px;padding:9px 16px;font-size:11px;color:var(--muted);backdrop-filter:var(--blur)}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Sections">
    <div class="mark">TW</div>
    <button aria-current="page" title="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg></button>
    <button title="All links"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
    <button title="Courts"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10m14 11V10M3 10l9-6 9 6"/><path d="M9 21v-6h6v6"/></svg></button>
    <button title="Research"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button title="Calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
    <div class="spacer"></div>
    <button id="themeBtn" title="Toggle theme"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10Z"/></svg></button>
    <button title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 15a1.6 1.6 0 0 0-1.5-1H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 8a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 7 3.7h.1A1.6 1.6 0 0 0 8.6 2.2V2a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 3.6h.1a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1.5H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.5Z"/></svg></button>
  </nav>

  <main>
    <div class="top">
      <h1>Dashboard<small id="sub">Loading the firm catalogue…</small></h1>
      <div class="segmented" id="seg"></div>
      <div class="right">
        <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--faint)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search portal…"></div>
        <button class="chip"><span class="avatar">BH</span> Bryan</button>
        <button class="chip solid">+ Add link</button>
      </div>
    </div>

    <div class="hero" id="hero"></div>

    <div class="board">
      <div class="stack" id="panels"></div>
      <div class="stack">
        <section class="panel">
          <header><span class="dot" style="--accent:var(--brand)"></span><h2>November 2026</h2><span class="count" id="calCount"></span></header>
          <div class="cal" id="cal"></div>
        </section>
        <section class="panel">
          <header><span class="dot" style="--accent:var(--teal)"></span><h2>At a glance</h2></header>
          <div class="stats">
            <div class="stat" style="--accent:var(--teal)"><b id="sLinks">—</b><small>Firm links</small></div>
            <div class="stat" style="--accent:var(--pink)"><b id="sCats">—</b><small>Categories</small></div>
            <div class="stat" style="--accent:var(--amber)"><b id="sPinned">—</b><small>Most used</small></div>
            <div class="stat" style="--accent:var(--green)"><b>M365</b><small>Connected</small></div>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
<div class="note">Prototype · real catalogue from links.json · nothing here is wired up yet</div>

<script>
/* ------------------------------------------------------------------
 * HERO ROW — edit these two lists to choose what appears in each card.
 * "Most Used" is not listed: it is measured from real clicks below.
 * ------------------------------------------------------------------ */
const COURT_LINKS = ['t3', 't10', 't18', 't13', 't15', 't20'];
//  t3 eFile Texas · t10 re:SearchTX · t18 PACER · t13 MoCo District Clerk
//  t15 HC District Clerk · t20 Harris JP Odyssey
const WOODLANDS_LAW = ['t27', 't26', 't31', 't30', 't28', 't29'];
//  t27 Woodlands Law · t26 Estate Site · t31 Phone Intake · t30 Cal.com
//  t28 WordPress · t29 N8N
const HERO_SLOTS = 6;

/* Usage is counted per person in this browser. When the real portal takes
 * this over it moves to twlfPrefs, which syncs to the user's OneDrive, so a
 * person's Most Used follows them between devices. */
const USAGE_KEY = 'twlf-usage-v1';
const readUsage = () => { try { return JSON.parse(localStorage.getItem(USAGE_KEY)) || {}; } catch { return {}; } };
function countClick(id) {
  const usage = readUsage();
  usage[id] = (usage[id] || 0) + 1;
  try { localStorage.setItem(USAGE_KEY, JSON.stringify(usage)); } catch { /* private mode */ }
}
document.addEventListener('click', event => {
  const hit = event.target.closest('[data-track]');
  if (hit) countClick(hit.dataset.track);
});

const ACCENTS = ['--teal','--pink','--amber','--green','--violet','--brand'];
const LOGO_EXT = {t2:'png',t3:'png',t4:'png',t5:'png',t7:'png',t11:'svg',t12:'png',t16:'png',t18:'png',t19:'png',t20:'png',t21:'png',t22:'png',t23:'png',t32:'png',t35:'jpg',t36:'png',t39:'png',t40:'png',t42:'png',t43:'png',t45:'png',t48:'png',t56:'png',t57:'svg',t58:'png',t59:'png',t60:'png',t61:'png',t62:'jpg',t64:'png',t72:'png',t73:'png',t74:'png',t75:'png',t76:'jpg',t77:'png',t78:'png',t80:'png',t81:'jpg',t82:'png'};
const logo = id => `logos/${id}.${LOGO_EXT[id] || 'ico'}`;
const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u; } };
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };

fetch('links.json').then(r => r.json()).then(data => {
  const byId = Object.fromEntries(data.links.map(l => [l.id, l]));
  const accentOf = {};
  data.categories.forEach((c, i) => accentOf[c.id] = ACCENTS[i % ACCENTS.length]);

  document.querySelector('#sub').textContent =
    `${data.links.length} firm links across ${data.categories.length} categories`;
  document.querySelector('#sLinks').textContent = data.links.length;
  document.querySelector('#sCats').textContent = data.categories.length;
  document.querySelector('#sPinned').textContent = data.defaultMostUsed.length;

  document.querySelector('#seg').innerHTML =
    ['All', ...data.categories.map(c => c.name)]
      .map((n, i) => `<button class="${i===0?'on':''}">${esc(n)}</button>`).join('');

  // Hero: three curated groups of links rather than three single destinations.
  const usage = readUsage();
  const ranked = Object.keys(usage)
    .filter(id => byId[id])
    .sort((a, b) => usage[b] - usage[a]);
  // Until someone has actually clicked around, fall back to the firm's pinned set.
  const mostUsed = [...ranked, ...data.defaultMostUsed.filter(id => !ranked.includes(id))]
    .slice(0, HERO_SLOTS);

  const groups = [
    { name: 'Most Used',     ids: mostUsed,      accent: '--teal',
      note: ranked.length ? 'Ranked by how often you open them' : 'Firm defaults until you start clicking' },
    { name: 'Court Links',   ids: COURT_LINKS,   accent: '--pink',  note: 'Filing, dockets and clerks' },
    { name: 'Woodlands Law', ids: WOODLANDS_LAW, accent: '--amber', note: 'Firm sites and internal tools' },
  ];

  document.querySelector('#hero').innerHTML = groups.map(group => {
    const items = group.ids.map(id => byId[id]).filter(Boolean).slice(0, HERO_SLOTS);
    const body = items.length
      ? `<div class="feature-links">${items.map(l => `
          <a class="mini" href="${esc(l.url)}" target="_blank" rel="noreferrer" data-track="${esc(l.id)}" title="${esc(l.name)}">
            <img src="${logo(l.id)}" alt="" onerror="this.style.visibility='hidden'">
            <span>${esc(l.name)}</span>${usage[l.id] ? `<b>${usage[l.id]}</b>` : ''}
          </a>`).join('')}</div>`
      : `<p class="empty">Nothing picked yet — add link IDs to this group at the top of the file.</p>`;
    return `<article class="feature" style="--accent:var(${group.accent})">
      <span class="badge">${esc(group.name)}</span>
      ${body}
      <p>${esc(group.note)}</p>
    </article>`;
  }).join('');

  document.querySelector('#panels').innerHTML = data.categories.map(c => {
    const items = data.links.filter(l => l.category === c.id);
    return `<section class="panel" style="--accent:var(${accentOf[c.id]})">
      <header><span class="dot" style="--accent:var(${accentOf[c.id]})"></span><h2>${esc(c.name)}</h2><span class="count">${items.length}</span></header>
      <div class="tiles">${items.map(l => `<a class="tile" href="${esc(l.url)}" target="_blank" rel="noreferrer" data-track="${esc(l.id)}" style="--accent:var(${accentOf[c.id]})">
        <span class="logo"><img src="${logo(l.id)}" alt="" onerror="this.style.display='none'"></span>
        <span class="txt"><strong>${esc(l.name)}</strong><small>${esc(host(l.url))}</small></span></a>`).join('')}</div>
    </section>`;
  }).join('');
});

// Month grid, with a few days marked to stand in for calendar events.
(function () {
  const now = new Date(2026, 10, 11);
  const first = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const busy = new Set([4, 11, 17, 23, 26]);
  let out = ['S','M','T','W','T','F','S'].map(d => `<span>${d}</span>`).join('');
  for (let i = 0; i < first; i++) out += '<b></b>';
  for (let d = 1; d <= days; d++) {
    const cls = d === now.getDate() ? 'now' : busy.has(d) ? 'has' : '';
    out += `<b class="${cls}">${d}</b>`;
  }
  document.querySelector('#cal').innerHTML = out;
  document.querySelector('#calCount').textContent = `${busy.size} events`;
})();

document.querySelector('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
});
</script>
</body>
</html>
