name: Deploy portal to Pages

# Replaces the auto-generated "pages build and deployment" pipeline, whose
# dynamic workflow wedged a run in `queued` and then failed every later run at
# startup with no cancellable job. Owning the workflow gives us our own
# concurrency group — with cancel-in-progress, so a stuck run is superseded
# rather than blocking everything behind it — and readable logs.
#
# Requires Settings > Pages > Source to be "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # to confirm the artifact exists before deploying it

# Concurrency groups are scoped to the repository, not to a workflow, so this
# must NOT be called "pages": that is the group the auto-generated pipeline
# uses, and its wedged run would hold this one in the queue behind it.
concurrency:
  group: portal-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the files the site needs are present
        run: |
          set -e
          for f in index.html app.js auth.js settings.js catalog.js modules.js \
                   styles.css workspace.css links.json CNAME .nojekyll \
                   assets/backdrop.jpg assets/manrope.woff2; do
            [ -e "$f" ] || { echo "missing required file: $f"; exit 1; }
          done
          echo "logo files: $(ls logos | wc -l)"
          echo "catalogue links: $(grep -o '"id"' links.json | wc -l)"

      - uses: actions/configure-pages@v5

      # .nojekyll in the repo root keeps this a verbatim copy of the tree.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # actions/deploy-pages asks the API for the artifact about half a second
      # after the upload reports success, and the metadata is not always
      # visible that fast: runs da69781 and 8d85ceb both died on "Found 0
      # artifact(s)" for an artifact whose upload had just been finalized.
      # Waiting for the API to agree it exists turns that race into a pause.
      - name: Wait for the artifact to be visible to the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
                      --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "artifact visible after ${attempt} check(s)"
              exit 0
            fi
            sleep 2
          done
          echo "the github-pages artifact never became visible to the API"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
